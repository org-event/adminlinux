schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: практический курс «Администрирование Linux» (mid+ и эшелон после MVP).
  Аудитория: middle+ и переход junior→middle; не развлекательный junior-only трек.
  Дистрибутивы: Debian 12 / Ubuntu 22.04+ LTS (AppArmor) и Rocky Linux 9 / AlmaLinux 9 (SELinux).
  Порядок модулей: 01–11 → 13–15 → 16–20 → 12 (капстоун). В каждом — краткая теория, лабораторная, критерии приёмки.
  Рабочий цикл: осмотр → изменение → проверка → запись → автоматизация.
  В капстоуне обязательно: TLS/HTTPS, метрики и алерты, сборка через Ansible (или apply playbooks), DR-drill на другой хост с RPO/RTO, postmortem;
  плюс ≥1 усиление из HA (18) / identity (17) / containers (19); желательно: perf (16), продвинутая сеть (20).
  Практика только в ВМ/контейнере/песочнице, не на боевых хостах.
  Материалы — в course/ и modules/; OpenSpec описывает структуру и правила контента.
  Backlog за эшелоном 16–20: FreeIPA replicas, Pacemaker, глубина CKA, eBPF deep-dive — не включать без отдельного change.

rules:
  proposal:
    - Писать на русском
    - Указывать Non-goals
    - Связывать изменения с конкретными модулями курса
  specs:
    - Требования формулировать как поведение курса/лаборатории
    - Сценарии — given/when/then на русском, ключевые слова SHALL/MUST на английском
  tasks:
    - Дробить работу на проверяемые шаги ≤ 2 часов
    - Отмечать зависимости между модулями

operations:
  apply:
    guidance:
      - Не ломать нумерацию модулей без обновления syllabus
      - Капстоун остаётся modules/12-capstone; mid+ 13–15 и эшелон 16–20 идут перед ним в программе
      - Сохранять единый шаблон lab.md (Цель, Окружение, Задания, Критерии приёмки, Подсказки, Очистка)
      - Таблицы двух семей там, где команды Debian/Ubuntu и Rocky/Alma расходятся
  archive:
    guidance:
      - Кратко суммировать, какие модули/спеки изменились
