schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Проект: практический последовательный курс «Администрирование Linux».
  Целевая аудитория: начинающие и младшие системные администраторы.
  Референс-дистрибутивы: Debian 12 / Ubuntu 22.04+ LTS и Rocky Linux 9 / AlmaLinux 9.
  Формат: модули по порядку; в каждом — краткая теория, лабораторная работа, критерии приёмки.
  Педагогический цикл (из открытых operator-first курсов): Inspect → Change → Verify → Document → Automate.
  Практику только в ВМ/контейнере/песочнице, не на боевых хостах.
  Материалы курса лежат в course/ и modules/; OpenSpec описывает структуру и правила контента.

rules:
  proposal:
    - Писать на русском
    - Указывать Non-goals
    - Связывать изменения с конкретными модулями курса
  specs:
    - Требования формулировать как поведение курса/лаборатории
    - Сценарии — given/when/then на русском, ключевые слова SHALL/MUST на английском
  tasks:
    - Дробить работу на проверяемые шаги ≤ 2 часов
    - Отмечать зависимости между модулями

operations:
  apply:
    guidance:
      - Не ломать нумерацию модулей без обновления syllabus
      - Сохранять единый шаблон lab.md
  archive:
    guidance:
      - Кратко суммировать, какие модули/спеки изменились
